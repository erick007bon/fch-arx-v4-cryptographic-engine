name: FCH-ARX V4 CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: pip install numpy

    - name: Validate Python Syntax
      run: |
        echo "Validating Python files..."
        cd "ENSAYOS CIENTIFICOS"
        python -m py_compile fch_arx_v41_core.py
        echo "fch_arx_v41_core.py: OK"
        python -c "from fch_arx_v41_core import fch_arx_v41; h = fch_arx_v41(b'test'); print(f'Hash output: {h}'); assert len(h) == 64, 'Hash length must be 64 hex chars'"
        echo "FCH-ARX V4 core functional test: PASSED"

    - name: Compile FCH-ARX V4 C Engine
      run: |
        echo "Compiling C Implementation with GCC..."
        cd "ENSAYOS CIENTIFICOS"
        gcc -O3 -march=native -funroll-loops -Wall -Wextra fch_arx_v4_fast.c -o fch_benchmark
        echo "Compilation successful. Running benchmark..."
        ./fch_benchmark
